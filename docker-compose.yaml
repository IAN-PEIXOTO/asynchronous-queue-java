services:
  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    restart: always
  postgres:
    image: postgres:17
    ports:
      - "127.0.0.1:1234:1234"
    environment:
      POSTGRES_DB: cepsdb
      POSTGRES_USER: IAN
      POSTGRES_PASSWORD: 200714
